name: PUMP Move Stop-Loss

# One-off, manual-only: replaces the resting SL trigger order on the current
# live PUMP position with a new price (e.g. to lock in profit). Never runs
# on a schedule. Only ever cancels/replaces the SL order — TP is untouched.
# hyperliquid_trader.py refuses to act if there's no open position, or if the
# new SL doesn't actually lock in profit vs entry (see move_stop_loss()).
on:
  workflow_dispatch:
    inputs:
      new_sl_px:
        description: "New SL trigger price (e.g. 0.0042590)"
        required: true
      dry_run:
        description: "Preview only (true) or actually place the order (false)"
        required: true
        default: "true"

permissions:
  contents: read

jobs:
  move-sl:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests hyperliquid-python-sdk

      - name: Move PUMP stop-loss
        run: python hyperliquid_trader.py
        env:
          PUMP_NEW_SL_PX: ${{ inputs.new_sl_px }}
          HL_DRY_RUN: ${{ inputs.dry_run }}
          HYPERLIQUID_API_PRIVATE_KEY: ${{ secrets.HYPERLIQUID_API_PRIVATE_KEY }}
          HYPERLIQUID_ACCOUNT_ADDRESS: ${{ secrets.HYPERLIQUID_ACCOUNT_ADDRESS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
