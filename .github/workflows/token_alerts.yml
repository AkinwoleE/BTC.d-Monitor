name: Token Watchlist Alerts

# Live Telegram alerts for a small Divergence 100 watchlist (default PUMP,
# ASTER — override via the ALERT_SYMBOLS repo variable, comma-separated).
# Fully independent of the BTC trading stack and of Divergence 100's own
# daily leaderboard rebuild: own schedule, own concurrency group, own data
# file (token_alerts.json). 2h timeframe only, hourly is plenty since a 2h
# candle doesn't close any more often than that.
#
# Also runs hyperliquid_trader.py (added 2026-08-29): automated PUMP trading
# on Hyperliquid off the same signal feed. Native exchange-side TP/SL means
# this doesn't need tighter polling than the alert step already runs on —
# see hyperliquid_trader.py's docstring for the full design. HL_DRY_RUN
# defaults to true (no real orders) until explicitly switched off via the
# repo variable.
on:
  schedule:
    - cron: "23 * * * *"   # hourly, offset from the other workflows' marks
  workflow_dispatch:

concurrency:
  group: token-alerts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests hyperliquid-python-sdk

      - name: Run token watchlist alerts
        run: python token_alerts.py
        env:
          ALERT_SYMBOLS: ${{ vars.ALERT_SYMBOLS || 'PUMP,ASTER' }}
          TP_SL_CONFIG: ${{ vars.TP_SL_CONFIG || '{"PUMP":{"tp":10,"sl":15}}' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Run Hyperliquid PUMP trader
        if: always()
        run: python hyperliquid_trader.py
        env:
          HL_DRY_RUN: ${{ vars.HL_DRY_RUN || 'true' }}
          HYPERLIQUID_API_PRIVATE_KEY: ${{ secrets.HYPERLIQUID_API_PRIVATE_KEY }}
          HYPERLIQUID_ACCOUNT_ADDRESS: ${{ secrets.HYPERLIQUID_ACCOUNT_ADDRESS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit data
        if: always()
        run: |
          git config user.name "token-alerts-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in token_alerts.json hyperliquid_trader_state.json hyperliquid_trades.json hyperliquid_equity.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git diff --cached --quiet && exit 0
          git commit -m "token-alerts: update data [skip ci]"
          git pull --rebase origin main || true
          git push origin main
