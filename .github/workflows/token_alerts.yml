name: Token Watchlist Alerts

# Live Telegram alerts for a small Divergence 100 watchlist (default PUMP,
# ASTER — override via the ALERT_SYMBOLS repo variable, comma-separated).
# Fully independent of the BTC trading stack and of Divergence 100's own
# daily leaderboard rebuild: own schedule, own concurrency group, own data
# file (token_alerts.json). 2h timeframe only, hourly is plenty since a 2h
# candle doesn't close any more often than that.
on:
  schedule:
    - cron: "23 * * * *"   # hourly, offset from the other workflows' marks
  workflow_dispatch:

concurrency:
  group: token-alerts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Run token watchlist alerts
        run: python token_alerts.py
        env:
          ALERT_SYMBOLS: ${{ vars.ALERT_SYMBOLS || 'PUMP,ASTER' }}
          TP_SL_CONFIG: ${{ vars.TP_SL_CONFIG || '{"PUMP":{"tp":10,"sl":15}}' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit data
        run: |
          git config user.name "token-alerts-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -f token_alerts.json ]; then git add token_alerts.json; fi
          git diff --cached --quiet && exit 0
          git commit -m "token-alerts: update data [skip ci]"
          git pull --rebase origin main || true
          git push origin main
