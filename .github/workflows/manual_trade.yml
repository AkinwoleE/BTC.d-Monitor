name: Manual Test Trade

# workflow_dispatch ONLY — this must never run on a schedule. It places one
# real (or dry-run) order on whichever account you pick, bypassing signal
# detection entirely. The resulting position is then picked up and managed
# normally (TP/SL/48h time-exit) by the regular divergence_monitor.yml runs.
on:
  workflow_dispatch:
    inputs:
      account:
        description: "Which account"
        required: true
        type: choice
        options: [primary, yar]
      side:
        description: "Direction"
        required: true
        type: choice
        options: [long, short]
      size_usd:
        description: "Notional size in USD"
        required: true
        default: "100"
      leverage:
        description: "Leverage"
        required: true
        default: "20"
      dry_run:
        description: "Dry run (no real order — just logs + Telegram what it would do)"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  manual-trade:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: pip install requests

      - name: Manual trade — primary account
        if: inputs.account == 'primary'
        run: python divergence_trader.py
        env:
          MANUAL_SIDE: ${{ inputs.side }}
          MANUAL_SIZE_USD: ${{ inputs.size_usd }}
          DIV_LEVERAGE: ${{ inputs.leverage }}
          DIV_DRY_RUN: ${{ inputs.dry_run }}
          DECIBEL_PRIVATE_KEY: ${{ secrets.DECIBEL_PRIVATE_KEY }}
          DECIBEL_SUBACCOUNT: ${{ secrets.DECIBEL_SUBACCOUNT }}
          DECIBEL_NODE_API_KEY: ${{ secrets.DECIBEL_NODE_API_KEY }}
          DECIBEL_GAS_STATION_API_KEY: ${{ secrets.DECIBEL_GAS_STATION_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Manual trade — Yar's account
        if: inputs.account == 'yar'
        run: python divergence_trader.py
        env:
          TRADER_ACCOUNT: yar
          MANUAL_SIDE: ${{ inputs.side }}
          MANUAL_SIZE_USD: ${{ inputs.size_usd }}
          DIV_LEVERAGE: ${{ inputs.leverage }}
          DIV_DRY_RUN: ${{ inputs.dry_run }}
          DECIBEL_PRIVATE_KEY: ${{ secrets.YAR_KEY }}
          DECIBEL_SUBACCOUNT: ${{ secrets.YAR_SUBACCOUNT }}
          DECIBEL_NODE_API_KEY: ${{ secrets.DECIBEL_NODE_API_KEY }}
          DECIBEL_GAS_STATION_API_KEY: ${{ secrets.DECIBEL_GAS_STATION_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit data
        if: always()
        run: |
          git config user.name "divergence-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in divergence_trader_state.json divergence_trades.json divergence_equity.json \
                   divergence_trader_state_yar.json divergence_trades_yar.json divergence_equity_yar.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git diff --cached --quiet && exit 0
          git commit -m "manual-trade: update data [skip ci]"
          git pull --rebase origin main || true
          git push origin main
