name: Turtle Multi-Asset Trader (Hyperliquid)

# Turtle System 2 on Hyperliquid, 28 instruments (18 crypto + 10
# equity/macro). Fully independent of every other system in this repo:
# own schedule, own concurrency group, own data files, own credentials
# (same Hyperliquid secrets as the PUMP trader, since it's the same
# account, but entirely separate state so the two never interfere).
#
# Primary trigger: cron-job.org job "Turtle Dry Run" (id 8401012) POSTs
# repository_dispatch turtle-cron-trigger at 01:12 Africa/Lagos = 00:12 UTC,
# just after the 00:00 UTC Binance daily close. GitHub's schedule at
# 00:10 UTC is the backup and has been observed hours late. Both runs can
# see the same completed candle; the bot's last_candle_ts mark makes the
# second one a no-op. The job starts by fast-forwarding to latest main so
# the later run sees the mark the earlier run just pushed.
#
# HL_DRY_RUN defaults to true. Paper writes turtle_hyperliquid_*.json.
# Live (TURTLE_HL_DRY_RUN=false) writes the *.live.json files and does not
# read the paper book. See docs/TURTLE.md.
on:
  repository_dispatch:
    types: [turtle-cron-trigger]
  schedule:
    - cron: "10 0 * * *"
  workflow_dispatch:

concurrency:
  group: turtle-hyperliquid
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Load hedge book
        run: |
          set -euo pipefail
          mkdir -p bot/runtime
          if git fetch --depth=1 origin +hedge-data:refs/remotes/origin/hedge-data; then
            if git cat-file -e origin/hedge-data:state.json 2>/dev/null; then
              git show origin/hedge-data:state.json > bot/runtime/state.json
            fi
          else
            echo "no hedge-data branch; Turtle uses the fallback book in bot/config.json"
          fi

      - name: Fast-forward to latest main
        if: github.ref_name == 'main'
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests "hyperliquid-python-sdk==0.24.0"

      - name: Run Turtle multi-asset trader
        run: python turtle_hyperliquid_trader.py
        env:
          HL_DRY_RUN: ${{ vars.TURTLE_HL_DRY_RUN || 'true' }}
          # Empty / unset stays on the code default (CL). A non-empty value
          # replaces that list; set NONE (not a roster symbol) to exclude nothing.
          TURTLE_EQUITY_EXCLUDE: ${{ vars.TURTLE_EQUITY_EXCLUDE || 'CL' }}
          HYPERLIQUID_API_PRIVATE_KEY: ${{ secrets.HYPERLIQUID_API_PRIVATE_KEY }}
          HYPERLIQUID_ACCOUNT_ADDRESS: ${{ secrets.HYPERLIQUID_ACCOUNT_ADDRESS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit data
        if: always()
        run: |
          git config user.name "turtle-hyperliquid-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in \
            turtle_hyperliquid_state.json \
            turtle_hyperliquid_trades.json \
            turtle_hyperliquid_equity.json \
            turtle_hyperliquid_state.live.json \
            turtle_hyperliquid_trades.live.json \
            turtle_hyperliquid_equity.live.json \
            turtle_hyperliquid_active.json
          do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if [ -d data/turtle_hyperliquid ]; then git add data/turtle_hyperliquid/; fi
          if [ -d data/turtle_equity ]; then git add data/turtle_equity/; fi
          git diff --cached --quiet && exit 0
          git commit -m "turtle-hyperliquid: update data [skip ci]"
          git pull --rebase origin main || true
          git push origin main
