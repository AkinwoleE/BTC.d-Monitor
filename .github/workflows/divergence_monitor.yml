name: RSI Divergence Monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [divergence-check]

# cancel-in-progress must stay FALSE: a run killed between placing an order and
# saving state would leave an untracked live position
concurrency:
  group: divergence-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: pip install requests

      - name: Run divergence monitor
        run: python divergence_monitor.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Run divergence trader
        run: python divergence_trader.py
        env:
          DIV_TRADING_ENABLED: ${{ vars.DIV_TRADING_ENABLED }}
          DIV_DRY_RUN: ${{ vars.DIV_DRY_RUN }}
          DIV_POSITION_USD: ${{ vars.DIV_POSITION_USD }}
          DIV_TP_USD: ${{ vars.DIV_TP_USD }}
          DIV_SL_USD: ${{ vars.DIV_SL_USD }}
          DIV_MAX_HOURS: ${{ vars.DIV_MAX_HOURS }}
          DIV_LEVERAGE: ${{ vars.DIV_LEVERAGE }}
          DECIBEL_PRIVATE_KEY: ${{ secrets.DECIBEL_PRIVATE_KEY }}
          DECIBEL_SUBACCOUNT: ${{ secrets.DECIBEL_SUBACCOUNT }}
          DECIBEL_NODE_API_KEY: ${{ secrets.DECIBEL_NODE_API_KEY }}
          DECIBEL_GAS_STATION_API_KEY: ${{ secrets.DECIBEL_GAS_STATION_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit data
        run: |
          git config user.name "divergence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add divergences.json divergence_trader_state.json divergence_trades.json divergence_equity.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "divergence: update data [skip ci]"
          git pull --rebase origin main || true
          git push origin main
