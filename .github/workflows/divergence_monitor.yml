name: RSI Divergence Monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [divergence-check]

concurrency:
  group: divergence-monitor
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Run divergence monitor
        run: python divergence_monitor.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit data
        run: |
          git config user.name "divergence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add divergences.json
          git diff --cached --quiet && exit 0
          git commit -m "divergence: update data [skip ci]"
          git pull --rebase origin main || true
          git push origin main
